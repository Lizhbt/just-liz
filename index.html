<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>just-liz.fr</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1c1c1e;
    --muted: #5b5b60;
    --border: #e2e2e5;
    --accent: #2f2f33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 80px 24px;
  }
  h1 {
    font-size: 1.8rem;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .sub {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 48px;
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  li {
    border-top: 1px solid var(--border);
  }
  li:last-child { border-bottom: 1px solid var(--border); }
  a {
    display: block;
    padding: 18px 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1rem;
    color: var(--text);
    text-decoration: none;
  }
  a:hover { color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>just-liz.fr</h1>
  <div class="sub">Pages liées à mes projets</div>
  <ul>
    <li><a href="/vex/">vex</a></li>
  </ul>
</div>
</body>
</html>
